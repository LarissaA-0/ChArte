<body>
  <!--Conteudo pagina home s/login-->

  <div class="header-conteiner">
    <header class="headerContent">
      <nav class="container menubar">
        <div class="left">
          <div class="charte_logo">
            <h1>ChArte</h1>
          </div>
        </div>

        <div class="center"></div>

        <div class="right-onLogin">
          <span class="hideOnMobile">
            <button class="nav-action" type="button" aria-label="Carrinho" title="Carrinho" (click)="abrirCarrinho()">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h8.9a2 2 0 0 0 1.9-1.4L22 8H6"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>
            </button>
            <button class="nav-action" type="button" aria-label="Chat" title="Chat" (click)="modal.openChat()">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.7 8.7 0 0 1-3.5-.7L4 20l1.1-3.5A7 7 0 0 1 4 12c0-4.1 3.6-7.5 8-7.5s8 3.1 8 7Z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></svg>
            </button>

            @if (!(auth.usuarioLogado$ | async)) {
              <button
                id="btnSouartista"
                class="btn btn-secondary btn_souArtista"
                (click)="modal.openModal('artistLogin')"
              >
                Sou artista
              </button>
              <button class="btn-primary btn btn_login" (click)="modal.openModal('login')">
                Login
              </button>
            }
          </span>


          <button class="nav-action profile-action" type="button" aria-label="Abrir menu" title="Menu" (click)="modal.openModal('subMenu')">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>
          </button>
        </div>
      </nav>
    </header>
  </div>
  <header class="container topContent">
    @if (showSearchCard) {
      @if (auth.usuarioLogado$ | async; as usuario) {
        <div class="sloganCard"><h2>Olá, {{ usuario.nomeUsuario }}</h2></div>
      } @else {
        <div class="sloganCard hideOnMobile"><h2>Conectando pessoas através da arte</h2></div>
      }
    }
    @if (showSearchCard) {
      <div class="searchCard">
        <span>
          <input class="input searchbar" type="search" placeholder="Pesquise" />
        </span>
      </div>
    }
  </header>
</body>
