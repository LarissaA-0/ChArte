<div class="pin-card" [class.apenas-imagem]="apenasImagem" (click)="abrirPinModal()" (keydown.enter)="abrirPinModal()" tabindex="0" role="button" [attr.aria-label]="'Abrir publicação: ' + post.titulo">
  @if (!apenasImagem) {
    <button
      class="btnFav"
      [class.saved]="favorites.contem(post.id)"
      type="button"
      [attr.aria-pressed]="favorites.contem(post.id)"
      [attr.aria-label]="favorites.contem(post.id) ? 'Remover dos favoritos' : 'Adicionar aos favoritos'"
      [title]="favorites.contem(post.id) ? 'Remover dos favoritos' : 'Adicionar aos favoritos'"
      (click)="alternarFavorito($event)"
    >
      <svg class="bookmark-icon" viewBox="0 0 24 24" aria-hidden="true">
        @if (favorites.contem(post.id)) {
          <path d="M6 3.75A1.75 1.75 0 0 1 7.75 2h8.5A1.75 1.75 0 0 1 18 3.75V22l-6-3.8L6 22V3.75Z" />
        } @else {
          <path d="M7.75 3h8.5A.75.75 0 0 1 17 3.75v16.43l-4.46-2.82a1 1 0 0 0-1.08 0L7 20.18V3.75A.75.75 0 0 1 7.75 3Z" />
        }
      </svg>
    </button>
  }

  <img class="pin-image" [src]="imagemArte" [alt]="post.titulo" />

  @if (!apenasImagem) {
    <div class="description">
      <div class="left">
        <a class="circle-sm" [routerLink]="['/perfil', post?.usuario?.nomeUsuario || 'muzzle']" (click)="$event.stopPropagation()">
          <img [src]="fotoArtista" [alt]="'Foto de perfil de ' + nomeArtista" />
        </a>
      </div>
      <div class="midle">
        <div class="title">{{ post.titulo }}</div>
        <div class="title">{{ nomeArtista.startsWith('@') ? nomeArtista : '@' + nomeArtista }}</div>
      </div>
    </div>
  }
</div>
