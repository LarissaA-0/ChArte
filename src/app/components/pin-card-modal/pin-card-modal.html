@if ((modal.modalOpen$ | async) === 'pinModal' && post) {
  <div class="modal-overlay" (click)="modal.closeModal()">
    <div class="container-login" (click)="$event.stopPropagation()">
      <div class="container-modal-pin">
        <button class="close-login" (click)="modal.closeModal()">×</button>

        <div class="left">
          <div class="pin-card modalPin">
            <img [src]="post.portfolio" [alt]="post.descricao" />
          </div>

          <div class="tags-container">
            <div class="tags">
              <span class="tag"> #{{ post.categoria?.nomeCategoria }} </span>
            </div>
          </div>
        </div>

        <div class="right">
          <!-- ARTISTA -->
          <div class="artist-info">
            <div
              class="circle-sm"
              [routerLink]="['/perfil', post?.usuario?.nomeUsuario || 'muzzle']"
              (click)="modal.closeModal()"
            >
              <img [src]="post?.usuario?.fotoPerfil" />
            </div>

            <div class="artist-name">
              <div class="modalTitle">{{ post.titulo }}</div>

              <div class="artist-username">@{{ post.nomeArtistico }}</div>
            </div>
          </div>

          <!-- DESCRIÇÃO -->
          <div class="description modalDescription">
            <p>{{ post.descricao || 'Esta publicação ainda não tem descrição.' }}</p>
          </div>
        </div>
        <div class="bottom-actions">
          <button
            class="btn-chat nav-action"
            type="button"
            aria-label="Abrir chat com o artista"
            title="Chat"
            (click)="abrirChatDoArtista()"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M20 11.5a7.5 7.5 0 0 1-8 7.5 8.7 8.7 0 0 1-3.5-.7L4 20l1.1-3.5A7 7 0 0 1 4 12c0-4.1 3.6-7.5 8-7.5s8 3.1 8 7Z"
              />
              <path d="M8 12h.01M12 12h.01M16 12h.01" />
            </svg>
          </button>

          <div class="bottom-right">
            <div class="price-block">
              <span class="price">R$ {{ post.preco }}</span>
            </div>

            <button class="btn-buy" type="button">Comprar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
}
