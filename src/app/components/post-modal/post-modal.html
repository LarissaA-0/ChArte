<div class="modal-overlay">
  <div class="modal-post">
    <!-- CABEÇALHO -->
    <header class="modal-header">
      <div>
        <h2>Nova postagem</h2>
        <p>Compartilhe uma nova arte com a comunidade</p>
      </div>

      <button type="button" class="btn-fechar" (click)="fecharModal()">×</button>
    </header>

    <!-- CONTEÚDO -->
    <div class="modal-content">
      <!-- IMAGEM -->
      <section class="imagem-section">
        <label class="section-title"> Imagem da arte </label>

        <div class="imagem-upload">
          <div class="upload-icon">+</div>

          <strong>Adicionar imagem</strong>
          <span>PNG, JPG ou JPEG</span>

          <input
            type="file"
            id="imagem"
            accept="image/png, image/jpeg"
            (change)="selecionarImagem($event)"
            hidden
          />

          <label for="imagem" class="btn-upload"> Escolher imagem </label>
        </div>
      </section>

      <!-- TÍTULO -->
      <div class="campo">
        <label for="titulo"> Título </label>

        <input id="titulo" type="text" [(ngModel)]="titulo" placeholder="Ex.: Floresta Encantada" />
      </div>

      <!-- DESCRIÇÃO -->
      <div class="campo">
        <label for="descricao"> Descrição </label>

        <textarea
          id="descricao"
          [(ngModel)]="descricao"
          placeholder="Conte um pouco sobre sua obra..."
        >
        </textarea>
      </div>

      <!-- CATEGORIA E ESTILO -->
      <div class="campos-linha">
        <div class="campo">
          <label for="categoria"> Categoria </label>

          <!--categoria vindo do bd-->
          <!--<select [(ngModel)]="categoria">
            <option value="">Selecione uma categoria</option>

            @for (categoria of categorias; track categoria.id) {
              <option [value]="categoria.id">
                {{ categoria.nome }}
              </option>
            }
          </select>-->
          <select id="categoria" [(ngModel)]="categoria">
            <option value="">Selecione uma categoria</option>

            <option value="ilustracao">Ilustração</option>

            <option value="pixel-art">Pixel Art</option>

            <option value="3d">3D</option>

            <option value="animacao">Animação</option>

            <option value="pintura">Pintura</option>
          </select>
        </div>

        <div class="campo">
          <label for="estilo"> Estilo </label>

          <select id="estilo" [(ngModel)]="estilo">
            <option value="">Selecione um estilo</option>

            <option value="anime">Anime</option>

            <option value="cartoon">Cartoon</option>

            <option value="realista">Realista</option>

            <option value="conceitual">Conceitual</option>

            <option value="minimalista">Minimalista</option>
          </select>
        </div>
      </div>

      <!-- COMPRA -->
      <section class="compra-section">
        <div class="compra-header">
          <div>
            <strong>Disponível para compra</strong>

            <p>Permitir que outros usuários possam comprar esta arte.</p>
          </div>

          <label class="switch">
            <input type="checkbox" [(ngModel)]="compravel" />

            <span class="slider"></span>
          </label>
        </div>

        @if (compravel) {
          <div class="campo preco">
            <label for="preco"> Preço </label>

            <div class="preco-input">
              <span>R$</span>

              <input
                id="preco"
                type="number"
                [(ngModel)]="preco"
                min="0"
                step="0.01"
                placeholder="0,00"
              />
            </div>
          </div>
        }
      </section>
    </div>

    <!-- RODAPÉ -->
    <footer class="modal-footer">
      <button type="button" class="btn-cancelar" (click)="fecharModal()">Cancelar</button>

      <button type="button" class="btn-publicar" (click)="publicarPostagem()">Publicar arte</button>
    </footer>
  </div>
</div>
